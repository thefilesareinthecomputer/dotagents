[project]
name = "agents-app"
version = "0.1.0"
description = "Chat with your agents: a local chat app with multi-agent group threads and a live knowledge-graph HUD over a markdown vault"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.scripts]
agents = "agents_app.app:main"
agn = "agents_app.app:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
