<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 232" width="620" height="232" role="img" aria-labelledby="roundTitle roundDesc">
  <title id="roundTitle">How one round is scheduled</title>
  <desc id="roundDesc">When a round opens, every addressed seat except the first speaker starts researching in its own repository in the background. Speaking turns run strictly one after another, and each speaker reads the replies that came before it.</desc>

  <defs>
    <marker id="rArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8B949E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="620" height="232" rx="10" fill="#0D1117"/>
  <rect x="0.75" y="0.75" width="618.5" height="230.5" rx="9.5" fill="none" stroke="#30363D" stroke-width="1.5"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">

    <text x="78" y="34" font-size="13" font-weight="600" fill="#8B949E" letter-spacing="0.06em">ONE MESSAGE OPENS A ROUND</text>

    <text x="62" y="102" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="600" fill="#8B949E">PREP</text>
    <text x="62" y="172" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="600" fill="#56D4DD">SPEECH</text>

    <rect x="78" y="56" width="347" height="32" rx="5" fill="#21262D" stroke="#8B949E" stroke-width="1.3" stroke-dasharray="5 3"/>
    <text x="92" y="77" font-size="13.5" fill="#ADBAC7">Gamma researching</text>

    <rect x="78" y="96" width="172" height="32" rx="5" fill="#21262D" stroke="#8B949E" stroke-width="1.3" stroke-dasharray="5 3"/>
    <text x="92" y="117" font-size="13.5" fill="#ADBAC7">Beta researching</text>

    <line x1="253" y1="132" x2="253" y2="156" stroke="#8B949E" stroke-width="1.4" marker-end="url(#rArrow)"/>
    <line x1="428" y1="92" x2="428" y2="156" stroke="#8B949E" stroke-width="1.4" marker-end="url(#rArrow)"/>

    <rect x="78" y="160" width="171" height="42" rx="6" fill="#0C2B33" stroke="#56D4DD" stroke-width="1.5"/>
    <text x="163" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#56D4DD">Alpha speaks</text>

    <rect x="253" y="160" width="171" height="42" rx="6" fill="#0C2B33" stroke="#56D4DD" stroke-width="1.5"/>
    <text x="338" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#56D4DD">Beta speaks</text>

    <rect x="428" y="160" width="171" height="42" rx="6" fill="#0C2B33" stroke="#56D4DD" stroke-width="1.5"/>
    <text x="513" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#56D4DD">Gamma speaks</text>

    <text x="338" y="222" text-anchor="middle" font-size="12.5" fill="#8B949E">prep runs in each seat's own repo; only speech is sequential</text>

  </g>
</svg>
