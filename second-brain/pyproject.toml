[project]
name = "second-brain"
version = "0.1.0"
description = "A second brain you can talk to: markdown vault, closed knowledge lifecycle, local chat app with a live knowledge-graph HUD."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.scripts]
brain = "second_brain.app:main"
b = "second_brain.app:main"
second-brain = "second_brain.app:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
