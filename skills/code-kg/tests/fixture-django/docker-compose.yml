services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - cache
    environment:
      DATABASE_URL: "postgres://app:app@db:5432/app"
      REDIS_URL: "redis://cache:6379"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app

  cache:
    image: redis:7
