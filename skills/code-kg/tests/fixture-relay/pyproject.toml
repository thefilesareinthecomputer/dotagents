[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay"
version = "0.4.2"
description = "Small agentic workflow engine (code-kg test fixture)"
requires-python = ">=3.10"

[project.scripts]
relay = "relay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
