name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . coverage pytest
      - run: python3 -m coverage run -m pytest -q tests
      - run: python3 -m coverage json -o coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx tsc -p tsconfig.json --noEmit

  release:
    needs: [python, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/release.sh
